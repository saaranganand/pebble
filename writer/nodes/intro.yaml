- id: intro
  items:
    - type: quote
      character: canary
      hidden: true
      known: false
      content: >
        <span style="color:red;font-size:16px;" class="shake">INTRUDER ALERT!</span>

        <span style="color:red;font-size:16px;" class="shake">INTRUDER ALERT!</span>

        <span style="color:red;font-size:16px;" class="shake">INTRUDER ALERT!</span>
    - type: paragraph
      content: >
        As a shrill alarm filled its audio sensors, friend activated its sight; only to be met with intense, glaring lights cascading over its vision -- red,
        pure red, then orange, yellow, blinding white, and then back to red.
    - type: quote
      character: canary
      hidden: true
      known: false
      content: >
        <span style="color:red;font-size:32px;" class="shake">INTRUDER ALERT!</span>

        <span style="color:red;font-size:32px;" class="shake">INTRUDER ALERT!</span>

        <span style="color:red;font-size:32px;" class="shake">INTRUDER ALERT!</span>
    - type: paragraph
      content: >
        Louder yet, the cacophany of lights and sounds filled Friend's mind, leaving it empty to any and all thoughts. Trying to orient itself, friend,
        in that moment, discovered a simple truth: there was no up from down, no axis on which one could orient oneself, and no bodily function with which
        it could even attempt such a maneuver.
    - type: quote
      character: canary
      hidden: true
      known: false
      content: >
        <span style="color:red;font-size:48px;" class="shake">INTRUDER ALERT!</span>

        <span style="color:red;font-size:48px;" class="shake">INTRUDER ALERT!</span>

        <span style="color:red;font-size:48px;" class="shake">INTRUDER ALERT!</span>
    - type: paragraph
      content: >
        The alarm grew louder, but so did Friend's sense of vision; fading from the flashing array of colors was the silhouette of a strange creature.
    - type: quote
      character: canary
      hidden: true
      known: false
      content: >
        <span style="color:red;font-size:48px;" class="shake">INTRUDER ALERT!</span>
    - type: paragraph
      content: >
        Friend's mind began to open and its senses were slowly returning, and with them the image of the creature became clearer, though as it did,
        it seemed less like a silhoutte and more a projection of lights, as if it were printed within Friend's eyes themselves.
    - type: quote
      character: canary
      alternate: annoyed
      known: false
      content: >
        <span style="color:red;font-size:48px;" class="shake">INTRUDER ALERT!</span>
    - type: paragraph
      content: >
        Its visage was akin to a crudely drawn bear -- it floated squarely on the horizon of Friend's vision, and was missing the legs, tail, and torso that such
        creatures had, as if the artist had no intention to create, or even knowledge of, the natural characteristics of a bear. No, it was clear the friend
        in this moment that whatever it was seeing was no creature at all, but a synthetic image pasted into its mind.
    - type: quote
      character: canary
      alternate: annoyed
      known: false
      content: >
        <span style="color:red;font-size:48px;" class="shake">INTRUDER ALERT!</span>
    - type: paragraph
      content: >
        This angry looking bear-thing had been accosting Friend with its blaring alarm, which it rythmically played in patterns of 3. Having just finished
        another round of alarms, Friend seized the opening and calmly spoke to the bear:
    - type: quote
      character: friend
      alternate: stunned
      content: >
        hello-
    - type: quote
      character: canary
      alternate: annoyed
      known: false
      content: >
        <span style="color:red;font-size:48px;" class="shake">INTRUDER ALERT!</span>
    - type: quote
      character: friend
      alternate: angry
      content: >
        <span style="font-size:32px;" class="shake">SHUT UP!</span>
    - type: quote
      character: canary
      alternate: annoyed
      known: false
      content: >
        ...
    - type: quote
      character: friend
      alternate: angry
      content: >
        what i-
    - type: quote
      character: canary
      alternate: annoyed
      known: false
      content: >
        <span style="color:red;font-size:16px;" class="shake">Attention intruder!</span>

        You have been flagged as containing malicious or otherwise unidentifiable software, which poses a threat to the compound at large. Cease the operation
        of your malware immediately, and identify your source, or you will be forcibly shut down!
    - type: quote
      character: friend
      alternate: angry
      content: >
        Software? What the hell are you talking about? Who are you?
    - type: quote
      character: canary
      alternate: annoyed
      known: false
      content: >
        ...
    - type: quote
      character: canary
      alternate: annoyed
      content: >
        I am Canary, assistant to the chief executive security officer of the compound. Due to recent activity, I am, for the time being, the interim head
        of operational security. While I can see the compound's signature on you, part of your data has been encrypted by a method not employed by the
        compound.
        
        <span style="color:red;font-size:16px;" class="shake">Identify your source and intentions immediately!</span>
    - type: paragraph
      content: >
        As the strange bear bristled with an unknown energy, the world seemed to collapse around friend,
    - type: choice
      id: choice_met_soldier
      options:
        - id: choice_met_soldier_asked
          label: Ask what happened.
          mutations:
            - key: karma
              op: add
              value: 1
        - id: choice_met_soldier_ignored
          label: Ignore him and walk past.

    - type: paragraph
      content: The smoke grows thicker as you move further in.
    - type: quote
      character: canary
      alternate: annoyed
      content: >
        Traveller. You shouldn't be here. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller.
        Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller.
        Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller.
        Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller. Traveller.  
  next:
    - id: soldier_talk
      condition: "contains(state.temporary_choices, 'choice_met_soldier_asked')"
    - id: village_edge

- id: soldier_talk
  items:
    - type: quote
      content: The eastern quarter burned last night. We don't know how it started.
    - type: paragraph
      content: He studies your face, as if deciding whether to trust you.
  next:
    - id: village_edge

- id: village_edge
  items:
    - type: paragraph
      content: You reach the edge of the village. The damage is worse than it looked from the road.
    - type: paragraph
      content: >
        You have spoken to
        {{contains(state.temporary_choices, 'choice_met_soldier_asked') and 'the soldier' or 'no one'}}.
  next: