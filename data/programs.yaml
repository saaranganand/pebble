# programs (powerups)

# a program can buff/nerf certain stats / make hits apply effects / both
# stat: "damage" -> buffs that stat on every weapon that has it
# stat: "bitpistol.miss_chance" -> buffs that one weapon's stat only
# effect tags match the effect system definitions ("burn", "frost_slow", ...)
# damage/duration are per-program instance params for that effect

- id: amplify
  buffs:
    - stat: damage
      multiplier: 1.25

- id: overclock
  buffs:
    - stat: fire_rate
      multiplier: 1.5

- id: checksum # bitpistol misses less often
  buffs:
    - stat: bitpistol.miss_chance
      multiplier: 0.5

- id: incendiary # set enemies on fire
  applies:
    - effect: burn
      damage: 5 # per pulse
      duration: 3 # s

- id: coolant # weaker hits, slows enemies
  buffs:
    - stat: damage
      multiplier: 0.9
  applies:
    - effect: frost_slow
      damage: 0
      duration: 2
